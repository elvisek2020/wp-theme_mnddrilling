# Po pushnutí tagu vX.Y.Z sestaví mnddrilling.zip (šablona) + mnddrilling-core.zip (plugin) a vytvoří GitHub Release.
# WordPress (updater v pluginu i šabloně) si pak aktualizaci najde sám.
name: Release šablony

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04  # pevně: ubuntu-latest se od 19. 10. 2026 přepne na Ubuntu 26 (jiné PHP); přechod udělat vědomě
    steps:
      - uses: actions/checkout@v5

      - name: Kontrola verze (tag = Version šablony i pluginu)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          THEME=$(grep -m1 -E '^Version:' theme/mnddrilling/style.css | awk '{print $2}')
          CORE=$(grep -m1 -E '^ \* Version:' plugins/mnddrilling-core/mnddrilling-core.php | awk '{print $3}')
          echo "tag=$TAG theme=$THEME core=$CORE"
          if [ "$TAG" != "$THEME" ] || [ "$TAG" != "$CORE" ]; then
            echo "::error::Tag v$TAG musí odpovídat Version ve style.css ($THEME) i v mnddrilling-core.php ($CORE)"; exit 1
          fi

      - name: Kontrola syntaxe PHP
        run: find theme/mnddrilling plugins/mnddrilling-core -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Sestavení ZIPů
        run: |
          (cd theme && zip -rq ../mnddrilling.zip mnddrilling -x 'mnddrilling/.gitkeep' -x '*/.DS_Store' -x 'mnddrilling/README.md')
          (cd plugins && zip -rq ../mnddrilling-core.zip mnddrilling-core -x '*/.DS_Store')
          unzip -l mnddrilling.zip | tail -1; unzip -l mnddrilling-core.zip | tail -1

      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mnddrilling.zip
            mnddrilling-core.zip
          generate_release_notes: true
